<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Restaurant</title>
    {% include 'delivery/_theme_assets.html' %}
</head>
<body>
    <main class="form-page">
        {% include 'delivery/_brand_lockup.html' %}
        <section class="page-heading">
            <p class="eyebrow">Workspace / Listings</p>
            <h1>Add restaurant</h1>
            <p class="lead">Add a neighborhood favorite to the directory.</p>
        </section>
        <form action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}
            <label for="name">Restaurant name</label>
            <input id="name" type="text" name="name" required>
            <label for="picture">Picture URL</label>
            <input id="picture" type="url" name="picture" required>
            <label for="cuisine">Cuisine</label>
            <input id="cuisine" type="text" name="cuisine" required>
            <label for="rating">Rating</label>
            <input id="rating" type="number" name="rating" min="0" max="5" step="0.5" required>
            <button type="submit">Add restaurant</button>
        </form>
        <a href="{% url 'open_show_restaurant' %}">Back to restaurants</a>
    </main>
</body>
</html>
