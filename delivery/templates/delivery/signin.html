<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Meal Mate</title>
    {% include 'delivery/_theme_assets.html' %}
</head>
<body>
    <main class="form-page">
        {% include 'delivery/_brand_lockup.html' %}
        <section class="page-heading">
            <p class="eyebrow">Welcome back</p>
            <h1>Sign in</h1>
            <p class="lead">Your next favorite meal is just around the corner.</p>
        </section>
        <form action="{% url 'signin' %}" method="post">
            {% csrf_token %}
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <div class="password-field">
                <input id="password" type="password" name="password" autocomplete="current-password" required>
                <button class="password-toggle" type="button" data-target="password" aria-label="Show password" aria-pressed="false">
                    <svg class="password-toggle__icon password-toggle__icon--show" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                    <svg class="password-toggle__icon password-toggle__icon--hide" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m3 3 18 18M10.6 6.2A10.4 10.4 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.8M6.4 6.4C3.9 8.1 2.5 12 2.5 12s3.5 6 9.5 6c1.6 0 3-.4 4.2-1"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                </button>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <a href="{% url 'open_signup' %}">New to Meal Mate? Create an account</a>
    </main>
</body>
</html>
